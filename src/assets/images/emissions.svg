<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="smokeGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#64748B;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:0.2" />
    </linearGradient>
    <linearGradient id="groundGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#15803D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyEmission" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#skyEmission)"/>
  
  <!-- Ground -->
  <rect y="450" width="800" height="150" fill="url(#groundGradient)"/>
  
  <!-- Factory Building -->
  <rect x="120" y="300" width="250" height="150" fill="#475569" rx="5"/>
  <rect x="140" y="320" width="50" height="60" fill="#94A3B8" rx="3"/>
  <rect x="210" y="320" width="50" height="60" fill="#94A3B8" rx="3"/>
  <rect x="280" y="320" width="50" height="60" fill="#94A3B8" rx="3"/>
  
  <!-- Smokestacks -->
  <rect x="160" y="200" width="40" height="100" fill="#334155" rx="3"/>
  <rect x="230" y="180" width="45" height="120" fill="#334155" rx="3"/>
  <rect x="305" y="210" width="40" height="90" fill="#334155" rx="3"/>
  
  <!-- Smoke Plumes -->
  <g opacity="0.7">
    <ellipse cx="180" cy="180" rx="50" ry="30" fill="url(#smokeGradient)">
      <animate attributeName="ry" values="30;40;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="180;170;180" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="170" cy="140" rx="60" ry="35" fill="url(#smokeGradient)">
      <animate attributeName="rx" values="60;70;60" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="140;130;140" dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="190" cy="100" rx="70" ry="40" fill="url(#smokeGradient)">
      <animate attributeName="ry" values="40;50;40" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;90;100" dur="5s" repeatCount="indefinite"/>
    </ellipse>
    
    <ellipse cx="252" cy="160" rx="55" ry="32" fill="url(#smokeGradient)">
      <animate attributeName="ry" values="32;42;32" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="160;150;160" dur="3.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="245" cy="115" rx="65" ry="38" fill="url(#smokeGradient)">
      <animate attributeName="rx" values="65;75;65" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="115;105;115" dur="4.5s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="260" cy="70" rx="75" ry="45" fill="url(#smokeGradient)">
      <animate attributeName="ry" values="45;55;45" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;60;70" dur="5.5s" repeatCount="indefinite"/>
    </ellipse>
    
    <ellipse cx="325" cy="190" rx="48" ry="28" fill="url(#smokeGradient)">
      <animate attributeName="ry" values="28;38;28" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="190;180;190" dur="3.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="335" cy="150" rx="58" ry="33" fill="url(#smokeGradient)">
      <animate attributeName="rx" values="58;68;58" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150;140;150" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Cars emitting exhaust -->
  <g transform="translate(500, 420)">
    <rect x="0" y="10" width="80" height="30" fill="#DC2626" rx="3"/>
    <circle cx="20" cy="45" r="10" fill="#1E293B"/>
    <circle cx="60" cy="45" r="10" fill="#1E293B"/>
    <rect x="70" y="15" width="15" height="15" fill="#FEF3C7" opacity="0.9"/>
    
    <!-- Exhaust -->
    <ellipse cx="-10" cy="25" rx="20" ry="10" fill="#94A3B8" opacity="0.5">
      <animate attributeName="rx" values="20;30;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0.2;0.5" dur="2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  
  <!-- Monitoring Graph Panel -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="280" height="200" fill="white" opacity="0.95" rx="10" stroke="#CBD5E1" stroke-width="2"/>
    <text x="140" y="30" font-size="16" font-weight="600" fill="#1E293B" text-anchor="middle">Emission Levels (CO₂)</text>
    
    <!-- Graph -->
    <line x1="30" y1="170" x2="250" y2="170" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="30" y1="50" x2="30" y2="170" stroke="#CBD5E1" stroke-width="2"/>
    
    <!-- Data line -->
    <path d="M 40 140 L 70 130 L 100 145 L 130 120 L 160 135 L 190 115 L 220 125 L 240 110" 
          stroke="#EF4444" stroke-width="3" fill="none"/>
    
    <!-- Data points -->
    <circle cx="40" cy="140" r="4" fill="#DC2626"/>
    <circle cx="70" cy="130" r="4" fill="#DC2626"/>
    <circle cx="100" cy="145" r="4" fill="#DC2626"/>
    <circle cx="130" cy="120" r="4" fill="#DC2626"/>
    <circle cx="160" cy="135" r="4" fill="#DC2626"/>
    <circle cx="190" cy="115" r="4" fill="#DC2626"/>
    <circle cx="220" cy="125" r="4" fill="#DC2626"/>
    <circle cx="240" cy="110" r="4" fill="#DC2626"/>
    
    <!-- Y-axis labels -->
    <text x="25" y="55" font-size="10" fill="#64748B" text-anchor="end">400</text>
    <text x="25" y="95" font-size="10" fill="#64748B" text-anchor="end">300</text>
    <text x="25" y="135" font-size="10" fill="#64748B" text-anchor="end">200</text>
    <text x="25" y="175" font-size="10" fill="#64748B" text-anchor="end">100</text>
    
    <!-- Legend -->
    <line x1="180" y1="185" x2="200" y2="185" stroke="#EF4444" stroke-width="2"/>
    <text x="205" y="189" font-size="11" fill="#64748B">ppm</text>
  </g>
  
  <!-- Alert Icon -->
  <g transform="translate(50, 80)">
    <circle cx="0" cy="0" r="40" fill="#FEF3C7" opacity="0.9"/>
    <path d="M -2 -15 L 2 -15 L 1 5 L -1 5 Z" fill="#F59E0B"/>
    <circle cx="0" cy="12" r="3" fill="#F59E0B"/>
  </g>
</svg>
