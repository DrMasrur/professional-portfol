<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="mlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0FDF4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DCFCE7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dataGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#mlBg)"/>
  
  <!-- Title Section -->
  <text x="400" y="60" font-size="32" font-weight="700" fill="#065F46" text-anchor="middle">Machine Learning Pipeline</text>
  
  <!-- Data Collection Box -->
  <g transform="translate(50, 120)">
    <rect width="140" height="100" rx="8" fill="white" stroke="#10B981" stroke-width="3"/>
    <text x="70" y="30" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Data Collection</text>
    
    <!-- Data icons -->
    <g fill="#10B981" opacity="0.7">
      <circle cx="35" cy="55" r="8"/>
      <circle cx="55" cy="55" r="8"/>
      <circle cx="45" cy="70" r="8"/>
      <circle cx="85" cy="55" r="8"/>
      <circle cx="105" cy="55" r="8"/>
      <circle cx="95" cy="70" r="8"/>
    </g>
  </g>
  
  <!-- Arrow 1 -->
  <g transform="translate(190, 170)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#10B981" stroke-width="3"/>
    <polygon points="50,0 42,-6 42,6" fill="#10B981"/>
  </g>
  
  <!-- Data Processing Box -->
  <g transform="translate(240, 120)">
    <rect width="140" height="100" rx="8" fill="white" stroke="#10B981" stroke-width="3"/>
    <text x="70" y="30" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Preprocessing</text>
    
    <!-- Gear icon -->
    <g transform="translate(70, 60)">
      <circle r="20" fill="none" stroke="#10B981" stroke-width="2"/>
      <circle r="10" fill="#10B981" opacity="0.5"/>
      <rect x="-3" y="-25" width="6" height="10" fill="#10B981"/>
      <rect x="-3" y="15" width="6" height="10" fill="#10B981"/>
      <rect x="-25" y="-3" width="10" height="6" fill="#10B981"/>
      <rect x="15" y="-3" width="10" height="6" fill="#10B981"/>
      
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 70 60"
        to="360 70 60"
        dur="4s"
        repeatCount="indefinite"/>
    </g>
  </g>
  
  <!-- Arrow 2 -->
  <g transform="translate(380, 170)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#10B981" stroke-width="3"/>
    <polygon points="50,0 42,-6 42,6" fill="#10B981"/>
  </g>
  
  <!-- Feature Engineering Box -->
  <g transform="translate(430, 120)">
    <rect width="140" height="100" rx="8" fill="white" stroke="#10B981" stroke-width="3"/>
    <text x="70" y="30" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Feature</text>
    <text x="70" y="46" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Engineering</text>
    
    <!-- Feature bars -->
    <rect x="20" y="55" width="25" height="35" fill="#10B981" opacity="0.6"/>
    <rect x="50" y="65" width="25" height="25" fill="#10B981" opacity="0.7"/>
    <rect x="80" y="60" width="25" height="30" fill="#10B981" opacity="0.8"/>
    <rect x="110" y="50" width="25" height="40" fill="#10B981" opacity="0.9"/>
  </g>
  
  <!-- Arrow 3 -->
  <g transform="translate(570, 170)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#10B981" stroke-width="3"/>
    <polygon points="50,0 42,-6 42,6" fill="#10B981"/>
  </g>
  
  <!-- Model Training Box -->
  <g transform="translate(620, 120)">
    <rect width="140" height="100" rx="8" fill="white" stroke="#10B981" stroke-width="3"/>
    <text x="70" y="30" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Model Training</text>
    
    <!-- Brain/Network icon -->
    <circle cx="70" cy="65" r="20" fill="#10B981" opacity="0.3"/>
    <circle cx="55" cy="60" r="6" fill="#10B981">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="85" cy="60" r="6" fill="#10B981">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="75" r="6" fill="#10B981">
      <animate attributeName="opacity" values="1;0.5;1" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
    <line x1="55" y1="60" x2="85" y2="60" stroke="#10B981" stroke-width="2"/>
    <line x1="55" y1="60" x2="70" y2="75" stroke="#10B981" stroke-width="2"/>
    <line x1="85" y1="60" x2="70" y2="75" stroke="#10B981" stroke-width="2"/>
  </g>
  
  <!-- Downward Arrow to Evaluation -->
  <g transform="translate(690, 220)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#10B981" stroke-width="3"/>
    <polygon points="0,60 -6,52 6,52" fill="#10B981"/>
  </g>
  
  <!-- Model Evaluation Box -->
  <g transform="translate(620, 280)">
    <rect width="140" height="100" rx="8" fill="white" stroke="#10B981" stroke-width="3"/>
    <text x="70" y="30" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Evaluation</text>
    
    <!-- Metrics display -->
    <text x="70" y="55" font-size="11" fill="#059669" text-anchor="middle">Accuracy: 94.2%</text>
    <text x="70" y="70" font-size="11" fill="#059669" text-anchor="middle">Precision: 92.8%</text>
    <text x="70" y="85" font-size="11" fill="#059669" text-anchor="middle">Recall: 93.5%</text>
  </g>
  
  <!-- Decision Diamond -->
  <g transform="translate(540, 330)">
    <path d="M 0,-30 L 40,0 L 0,30 L -40,0 Z" fill="white" stroke="#10B981" stroke-width="3"/>
    <text x="0" y="-5" font-size="12" font-weight="600" fill="#065F46" text-anchor="middle">Good</text>
    <text x="0" y="8" font-size="12" font-weight="600" fill="#065F46" text-anchor="middle">Model?</text>
  </g>
  
  <!-- No Arrow - back to training -->
  <g>
    <path d="M 500 330 Q 460 330, 460 270 L 460 220" stroke="#EF4444" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <polygon points="460,220 454,228 466,228" fill="#EF4444"/>
    <text x="440" y="280" font-size="12" font-weight="600" fill="#DC2626">No</text>
  </g>
  
  <!-- Yes Arrow - to deployment -->
  <g transform="translate(500, 330)">
    <line x1="0" y1="0" x2="-80" y2="0" stroke="#10B981" stroke-width="3"/>
    <polygon points="-80,0 -72,-6 -72,6" fill="#10B981"/>
    <text x="-40" y="-10" font-size="12" font-weight="600" fill="#059669">Yes</text>
  </g>
  
  <!-- Deployment Box -->
  <g transform="translate(280, 280)">
    <rect width="140" height="100" rx="8" fill="white" stroke="#10B981" stroke-width="3"/>
    <text x="70" y="30" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Deployment</text>
    
    <!-- Cloud icon -->
    <ellipse cx="70" cy="65" rx="25" ry="15" fill="#10B981" opacity="0.5"/>
    <ellipse cx="55" cy="70" rx="20" ry="12" fill="#10B981" opacity="0.6"/>
    <ellipse cx="85" cy="70" rx="20" ry="12" fill="#10B981" opacity="0.6"/>
    <rect x="40" y="70" width="60" height="8" fill="#10B981" opacity="0.5"/>
    
    <!-- Checkmark -->
    <path d="M 60 82 L 66 88 L 80 72" stroke="#059669" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Monitoring Arrow -->
  <g transform="translate(350, 380)">
    <line x1="0" y1="0" x2="0" y2="50" stroke="#10B981" stroke-width="3"/>
    <polygon points="0,50 -6,42 6,42" fill="#10B981"/>
  </g>
  
  <!-- Monitoring Box -->
  <g transform="translate(280, 430)">
    <rect width="140" height="80" rx="8" fill="white" stroke="#10B981" stroke-width="3"/>
    <text x="70" y="28" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Monitoring &</text>
    <text x="70" y="45" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">Maintenance</text>
    
    <!-- Activity indicator -->
    <g transform="translate(70, 62)">
      <circle cx="-15" cy="0" r="4" fill="#10B981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="4" fill="#10B981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="15" cy="0" r="4" fill="#10B981">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Feedback loop to data collection -->
  <g>
    <path d="M 280 470 Q 150 480, 120 400" stroke="#10B981" stroke-width="2" fill="none" stroke-dasharray="5,5"/>
    <polygon points="120,400 114,408 122,413" fill="#10B981"/>
    <text x="180" y="500" font-size="11" fill="#059669" text-anchor="middle">Feedback Loop</text>
  </g>
  
  <!-- Algorithm Labels Box -->
  <g transform="translate(50, 330)">
    <rect width="180" height="180" rx="8" fill="white" stroke="#D1FAE5" stroke-width="2" opacity="0.95"/>
    <text x="90" y="25" font-size="14" font-weight="600" fill="#065F46" text-anchor="middle">ML Algorithms</text>
    
    <text x="15" y="50" font-size="11" fill="#059669">• Random Forest</text>
    <text x="15" y="68" font-size="11" fill="#059669">• Gradient Boosting</text>
    <text x="15" y="86" font-size="11" fill="#059669">• Support Vector Machines</text>
    <text x="15" y="104" font-size="11" fill="#059669">• Decision Trees</text>
    <text x="15" y="122" font-size="11" fill="#059669">• K-Nearest Neighbors</text>
    <text x="15" y="140" font-size="11" fill="#059669">• Neural Networks</text>
    <text x="15" y="158" font-size="11" fill="#059669">• Ensemble Methods</text>
  </g>
</svg>
