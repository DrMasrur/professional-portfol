<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E1B4B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312E81;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="nodeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>
  
  <!-- Neural Network Structure -->
  
  <!-- Input Layer (3 nodes) -->
  <g id="inputLayer">
    <circle cx="100" cy="200" r="25" fill="url(#nodeGradient)" filter="url(#glow)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="300" r="25" fill="url(#nodeGradient)" filter="url(#glow)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="400" r="25" fill="url(#nodeGradient)" filter="url(#glow)" opacity="0.9">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Hidden Layer 1 (5 nodes) -->
  <g id="hiddenLayer1">
    <circle cx="300" cy="120" r="22" fill="#10B981" filter="url(#glow)" opacity="0.85"/>
    <circle cx="300" cy="220" r="22" fill="#10B981" filter="url(#glow)" opacity="0.85"/>
    <circle cx="300" cy="300" r="22" fill="#10B981" filter="url(#glow)" opacity="0.85"/>
    <circle cx="300" cy="380" r="22" fill="#10B981" filter="url(#glow)" opacity="0.85"/>
    <circle cx="300" cy="480" r="22" fill="#10B981" filter="url(#glow)" opacity="0.85"/>
  </g>
  
  <!-- Hidden Layer 2 (4 nodes) -->
  <g id="hiddenLayer2">
    <circle cx="500" cy="160" r="22" fill="#3B82F6" filter="url(#glow)" opacity="0.85"/>
    <circle cx="500" cy="260" r="22" fill="#3B82F6" filter="url(#glow)" opacity="0.85"/>
    <circle cx="500" cy="340" r="22" fill="#3B82F6" filter="url(#glow)" opacity="0.85"/>
    <circle cx="500" cy="440" r="22" fill="#3B82F6" filter="url(#glow)" opacity="0.85"/>
  </g>
  
  <!-- Output Layer (2 nodes) -->
  <g id="outputLayer">
    <circle cx="700" cy="250" r="25" fill="#F59E0B" filter="url(#glow)" opacity="0.9"/>
    <circle cx="700" cy="350" r="25" fill="#F59E0B" filter="url(#glow)" opacity="0.9"/>
  </g>
  
  <!-- Connections from Input to Hidden Layer 1 -->
  <g stroke="#8B5CF6" stroke-width="1.5" opacity="0.3">
    <line x1="125" y1="200" x2="278" y2="120"/>
    <line x1="125" y1="200" x2="278" y2="220"/>
    <line x1="125" y1="200" x2="278" y2="300"/>
    <line x1="125" y1="200" x2="278" y2="380"/>
    <line x1="125" y1="200" x2="278" y2="480"/>
    
    <line x1="125" y1="300" x2="278" y2="120"/>
    <line x1="125" y1="300" x2="278" y2="220" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="125" y1="300" x2="278" y2="300" stroke-width="2" opacity="0.6">
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    <line x1="125" y1="300" x2="278" y2="380"/>
    <line x1="125" y1="300" x2="278" y2="480"/>
    
    <line x1="125" y1="400" x2="278" y2="120"/>
    <line x1="125" y1="400" x2="278" y2="220"/>
    <line x1="125" y1="400" x2="278" y2="300"/>
    <line x1="125" y1="400" x2="278" y2="380"/>
    <line x1="125" y1="400" x2="278" y2="480"/>
  </g>
  
  <!-- Connections from Hidden Layer 1 to Hidden Layer 2 -->
  <g stroke="#10B981" stroke-width="1.5" opacity="0.3">
    <line x1="322" y1="120" x2="478" y2="160"/>
    <line x1="322" y1="120" x2="478" y2="260"/>
    <line x1="322" y1="120" x2="478" y2="340"/>
    <line x1="322" y1="120" x2="478" y2="440"/>
    
    <line x1="322" y1="220" x2="478" y2="160"/>
    <line x1="322" y1="220" x2="478" y2="260" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="322" y1="220" x2="478" y2="340"/>
    <line x1="322" y1="220" x2="478" y2="440"/>
    
    <line x1="322" y1="300" x2="478" y2="160"/>
    <line x1="322" y1="300" x2="478" y2="260"/>
    <line x1="322" y1="300" x2="478" y2="340" stroke-width="2" opacity="0.7">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.5s" begin="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="322" y1="300" x2="478" y2="440"/>
    
    <line x1="322" y1="380" x2="478" y2="160"/>
    <line x1="322" y1="380" x2="478" y2="260"/>
    <line x1="322" y1="380" x2="478" y2="340"/>
    <line x1="322" y1="380" x2="478" y2="440"/>
    
    <line x1="322" y1="480" x2="478" y2="160"/>
    <line x1="322" y1="480" x2="478" y2="260"/>
    <line x1="322" y1="480" x2="478" y2="340"/>
    <line x1="322" y1="480" x2="478" y2="440"/>
  </g>
  
  <!-- Connections from Hidden Layer 2 to Output -->
  <g stroke="#3B82F6" stroke-width="1.5" opacity="0.3">
    <line x1="522" y1="160" x2="675" y2="250"/>
    <line x1="522" y1="160" x2="675" y2="350"/>
    
    <line x1="522" y1="260" x2="675" y2="250" stroke-width="2.5" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="522" y1="260" x2="675" y2="350"/>
    
    <line x1="522" y1="340" x2="675" y2="250"/>
    <line x1="522" y1="340" x2="675" y2="350" stroke-width="2.5" opacity="0.8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" begin="0.5s" repeatCount="indefinite"/>
    </line>
    
    <line x1="522" y1="440" x2="675" y2="250"/>
    <line x1="522" y1="440" x2="675" y2="350"/>
  </g>
  
  <!-- Labels -->
  <text x="100" y="520" font-size="16" font-weight="600" fill="#A78BFA" text-anchor="middle">Input Layer</text>
  <text x="300" y="540" font-size="16" font-weight="600" fill="#10B981" text-anchor="middle">Hidden Layers</text>
  <text x="700" y="490" font-size="16" font-weight="600" fill="#F59E0B" text-anchor="middle">Output Layer</text>
  
  <!-- Title -->
  <text x="400" y="50" font-size="28" font-weight="700" fill="#E0E7FF" text-anchor="middle">Deep Neural Network</text>
  <text x="400" y="75" font-size="14" fill="#C4B5FD" text-anchor="middle">Artificial Intelligence Model Architecture</text>
  
  <!-- Data Flow Indicators -->
  <g>
    <path d="M 140 250 L 160 250" stroke="#8B5CF6" stroke-width="2" fill="none">
      <animate attributeName="d" values="M 140 250 L 160 250;M 160 250 L 180 250;M 180 250 L 200 250" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 340 280 L 360 280" stroke="#10B981" stroke-width="2" fill="none">
      <animate attributeName="d" values="M 340 280 L 360 280;M 360 280 L 380 280;M 380 280 L 400 280" dur="1s" repeatCount="indefinite"/>
    </path>
    <path d="M 540 300 L 560 300" stroke="#3B82F6" stroke-width="2" fill="none">
      <animate attributeName="d" values="M 540 300 L 560 300;M 560 300 L 580 300;M 580 300 L 600 300" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
