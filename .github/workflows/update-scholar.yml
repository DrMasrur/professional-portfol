name: Update Google Scholar Metrics

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  update-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Fetch and update profile metrics
        env:
          SCHOLAR_USER: ${{ secrets.SCHOLAR_USER }}
          SCHOLAR_PROFILE_URL: ${{ secrets.SCHOLAR_PROFILE_URL }}
        run: node scripts/update-profile-metrics.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/data/profile.json
            git commit -m "chore: update Google Scholar metrics [ci skip]"
            git push
          else
            echo "No changes to commit."
          fi
